<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Server Monitor</title>
    <link rel="stylesheet" href="./static/minecraft.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #ffffff;
            min-height: 100vh;
            transition: background-color 0.5s ease;
        }

        body.online {
            background: #34eb49;
        }

        body.offline {
            background: #e01c1c;
        }

        body.checking {
            background: #1a1a1a;
        }

        /* ── Landing view ── */

        #landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 24px;
            padding: 40px 20px;
            background: #1a1a1a;
        }

        #landing h1 {
            font-size: clamp(20px, 5vw, 36px);
            text-align: center;
            text-shadow: 3px 3px #000;
        }

        #landing form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 420px;
        }

        #serverInput {
            font-family: Minecraftia, monospace;
            font-size: 16px;
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 2px solid #555;
            color: #fff;
            outline: none;
        }

        #serverInput:focus {
            border-color: #aaa;
        }

        #landing button {
            font-family: Minecraftia, monospace;
            font-size: 16px;
            padding: 12px 32px;
            background: #4a4a4a;
            border: 2px solid #888;
            color: #fff;
            cursor: pointer;
        }

        #landing button:hover {
            background: #666;
            border-color: #aaa;
        }

        /* ── Recently viewed ── */

        #recentSection {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 420px;
        }

        #recentSection p {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #recentList {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .recent-btn {
            font-family: Minecraftia, monospace;
            font-size: 12px;
            padding: 6px 14px;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #ccc;
            cursor: pointer;
        }

        .recent-btn:hover {
            background: #3a3a3a;
            border-color: #888;
            color: #fff;
        }

        /* ── Monitor view ── */

        #monitor {
            display: none;
            padding: 32px 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .monitor-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .server-address {
            font-size: clamp(26px, 4vw, 48px);
            font-weight: bold;
            text-decoration: underline;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            word-break: break-all;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .status-indicator {
            font-size: 16px;
            opacity: 0.85;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .player-count {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .players-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .player {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .player img {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
            border: 1px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: break-word;
            min-width: 0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 28px;
            font-family: Minecraftia, monospace;
            font-size: 12px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        /* Scrollbar styling */
        .players-container::-webkit-scrollbar {
            width: 8px;
        }

        .players-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .players-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
        }

        .players-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="checking">

    <!-- Landing view -->
    <div id="landing">
        <h1>MC Server Monitor</h1>
        <form id="serverForm">
            <input
                id="serverInput"
                type="text"
                placeholder="e.g. hypixel.net"
                autocomplete="off"
                spellcheck="false"
                required
            >
            <button type="submit">Go</button>
        </form>

        <div id="recentSection">
            <p>Recently viewed</p>
            <div id="recentList"></div>
        </div>
    </div>

    <!-- Monitor view -->
    <div id="monitor">
        <div class="monitor-header">
            <div class="server-address" id="serverAddress">Loading...</div>
            <div class="status-bar">
                <div class="status-indicator" id="statusIndicator">● Checking...</div>
                <div class="player-count" id="playerCount">Players: --</div>
            </div>
        </div>

        <div class="players-container" id="playersContainer"></div>

        <button class="back-btn" id="backBtn">&#8592; Change server</button>
    </div>

    <script>
        const RECENT_KEY = 'mc_recent_servers';
        const RECENT_MAX = 5;

        let pollInterval = null;
        let currentAddress = '';

        const landingEl = document.getElementById('landing');
        const monitorEl = document.getElementById('monitor');
        const formEl = document.getElementById('serverForm');
        const inputEl = document.getElementById('serverInput');
        const addressEl = document.getElementById('serverAddress');
        const statusEl = document.getElementById('statusIndicator');
        const countEl = document.getElementById('playerCount');
        const containerEl = document.getElementById('playersContainer');
        const backBtn = document.getElementById('backBtn');
        const recentSection = document.getElementById('recentSection');
        const recentList = document.getElementById('recentList');

        // ── Recently viewed ──

        function getRecent() {
            try {
                return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
            } catch {
                return [];
            }
        }

        function saveRecent(address) {
            const list = getRecent().filter(a => a !== address);
            list.unshift(address);
            localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX)));
        }

        function renderRecent() {
            const list = getRecent();
            if (list.length === 0) {
                recentSection.style.display = 'none';
                return;
            }
            recentSection.style.display = 'flex';
            recentList.innerHTML = list
                .map(addr => `<button class="recent-btn" data-addr="${addr}">${addr}</button>`)
                .join('');
        }

        recentList.addEventListener('click', function (e) {
            const btn = e.target.closest('.recent-btn');
            if (!btn) return;
            startMonitor(btn.dataset.addr);
        });

        // ── View switching ──

        formEl.addEventListener('submit', function (e) {
            e.preventDefault();
            const address = inputEl.value.trim();
            if (!address) return;
            startMonitor(address);
        });

        backBtn.addEventListener('click', function () {
            stopMonitor();
            showLanding();
        });

        function showLanding() {
            document.body.className = 'checking';
            monitorEl.style.display = 'none';
            landingEl.style.display = 'flex';
            renderRecent();
        }

        function showMonitor() {
            landingEl.style.display = 'none';
            monitorEl.style.display = 'block';
        }

        function startMonitor(address) {
            currentAddress = address;
            addressEl.textContent = address;
            statusEl.textContent = '● Checking...';
            countEl.textContent = 'Players: --';
            containerEl.innerHTML = '';
            document.body.className = 'checking';

            saveRecent(address);
            showMonitor();
            fetchStatus();
            pollInterval = setInterval(fetchStatus, 30000);
        }

        function stopMonitor() {
            if (pollInterval !== null) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        // ── Data fetching ──

        async function fetchStatus() {
            try {
                const apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                    ? ''
                    : 'https://api.mcsrvstat.us';
                const response = await fetch(`${apiBase}/3/${currentAddress}`);
                const data = await response.json();

                const reached = data.debug && data.debug.ping;

                if (!reached) {
                    setOffline();
                    return;
                }

                if (!data.online) {
                    setOffline();
                    return;
                }

                const playersList = ((data.players && data.players.list) || []).slice(0, 27);
                const playerCount = (data.players && data.players.online) || 0;

                document.body.className = 'online';
                statusEl.textContent = '● Online';
                countEl.textContent = `Players: ${playerCount}`;

                if (playersList.length > 0) {
                    containerEl.style.display = 'grid';
                    containerEl.innerHTML = playersList
                        .map(player => {
                            const headUrl = player.uuid
                                ? `https://mc-heads.net/avatar/${player.uuid}/40`
                                : 'https://mc-heads.net/avatar/MHF_Steve/40';
                            return `<div class="player">
                                <img src="${headUrl}" alt="${player.name}">
                                <span class="player-name">${player.name}</span>
                            </div>`;
                        })
                        .join('');
                } else {
                    containerEl.style.display = 'none';
                    containerEl.innerHTML = '';
                }

            } catch (err) {
                setOffline();
            }
        }

        function setOffline() {
            document.body.className = 'offline';
            statusEl.textContent = '● Offline';
            countEl.textContent = 'Players: 0';
            containerEl.style.display = 'none';
            containerEl.innerHTML = '';
        }

        // ── Init ──

        renderRecent();
    </script>
</body>
</html>
