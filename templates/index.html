<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitor</title>
    <link rel="stylesheet" href="/static/minecraft.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #ffffff;
            transition: background-color 0.5s ease;
        }

        .dashboard {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(24px, 5vw, 64px);
            gap: clamp(16px, 3vh, 40px);
        }

        body.online {
            background: #34eb49;
        }

        body.offline {
            background: #e01c1c;
        }

        body.checking {
            background: #1a1a1a;
        }

        .server-address {
            font-size: clamp(22px, 5vw, 56px);
            font-weight: bold;
            text-align: center;
            text-decoration: underline;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(8px, 2vw, 20px) clamp(12px, 3vw, 28px);
        }

        .status-indicator {
            font-size: clamp(13px, 3vw, 28px);
            opacity: 0.8;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .player-count {
            font-size: clamp(14px, 3.5vw, 32px);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .players-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: clamp(10px, 2.5vw, 24px);
        }

        .player {
            padding: clamp(6px, 1.5vw, 14px);
            margin: clamp(4px, 1vw, 8px) 0;
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 20px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .player img {
            width: clamp(24px, 4vw, 48px);
            height: clamp(24px, 4vw, 48px);
            image-rendering: pixelated;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .player-name {
            font-size: clamp(14px, 3.5vw, 36px);
            font-weight: bold;
        }

    </style>
</head>
<body class="checking">
    <div class="dashboard">
        <div class="server-address" id="serverAddress">Loading...</div>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator">● Checking...</div>
            <div class="player-count" id="playerCount">Players: --</div>
        </div>

        <div class="players-container" id="playersContainer"></div>
    </div>

    <script>
        const source = new EventSource('/stream');

        source.onmessage = function(event) {
            const data = JSON.parse(event.data);

            const bodyEl = document.body;
            const addressEl = document.getElementById('serverAddress');
            const statusEl = document.getElementById('statusIndicator');
            const countEl = document.getElementById('playerCount');
            const containerEl = document.getElementById('playersContainer');

            if (data.address) {
                addressEl.textContent = data.address;
            }

            if (data.online) {
                bodyEl.className = 'online';
                statusEl.textContent = '● Online';
                countEl.textContent = `Players: ${data.player_count}`;

                if (data.players && data.players.length > 0) {
                    containerEl.style.display = 'block';
                    containerEl.innerHTML = data.players
                        .map(player => {
                            const headUrl = data.heads[player.name] || '';
                            return `<div class="player">
                                <img src="${headUrl}" alt="${player.name}">
                                <span class="player-name">${player.name}</span>
                            </div>`;
                        })
                        .join('');
                } else {
                    containerEl.style.display = 'none';
                    containerEl.innerHTML = '';
                }
            } else {
                bodyEl.className = 'offline';
                statusEl.textContent = '● Offline';
                countEl.textContent = 'Players: 0';
                containerEl.style.display = 'none';
                containerEl.innerHTML = '';
            }
        };

        source.onerror = function() {
            if (source.readyState === EventSource.CLOSED) {
                document.body.className = 'offline';
                document.getElementById('statusIndicator').textContent = '● Error';
                document.getElementById('playerCount').textContent = 'Players: --';
            }
        };
    </script>
</body>
</html>
